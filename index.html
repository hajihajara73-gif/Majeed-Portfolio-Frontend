<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The title and description are the AUTHORED DEFAULTS, kept here on one
         line each so the page is still correct if the build plugin never runs.
         They are authored in src/content/seo.ts, and the `site-metadata`
         plugin rewrites them IN PLACE when the CMS has overridden either one
         (see vite.config.ts). Keep them on one line and keep them in sync. -->
    <title>Mohammed Majeed J — Full Stack &amp; Python Backend Developer</title>
    <meta name="description" content="Portfolio of Mohammed Majeed J — a full stack developer building Python and FastAPI backends, React interfaces, and applied AI projects." />
    <meta name="theme-color" content="#0a0e0c" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph. Only the two tags that never vary live here. Everything
         else in the social and structured-data block — og:title,
         og:description, og:site_name, og:locale, the canonical link, og:url,
         the ABSOLUTE og:image with its dimensions, the twitter:* tags, the
         robots directive and the JSON-LD — is emitted at build time by the
         `site-metadata` plugin, because each one depends on either the site
         URL or the published CMS snapshot. One owner, so there can be no
         duplicate title or description. -->
    <!-- `website`, not `profile`: og:type=profile is about the OBJECT being a
         person and expects profile:first_name/last_name to go with it, which
         would be a second place to keep the same facts. The page is a site
         homepage. That the page is *about* a person is already said precisely,
         in the JSON-LD, by ProfilePage + mainEntity. -->
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts. The site is fully legible in the fallback stack if these fail,
         so they are never render-blocking: `media="print"` keeps the stylesheet
         out of the critical path and the app flips it to `all` once mounted.

         The flip used to be an inline `onload="this.media='all'"` handler. It
         was moved into the bundle so the Content-Security-Policy does not have
         to allow inline script — one inline handler would have meant
         `script-src 'unsafe-inline'`, which is most of the protection gone. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="webfonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
      />
    </noscript>

    <!-- The poster is the first meaningful paint of the hero, so fetch it early.
         The video itself is deliberately NOT preloaded — it is decided at
         runtime by useCanvasPolicy and must not compete with content. -->
    <link
      rel="preload"
      as="image"
      href="/assets/background/cabin-poster.webp"
      type="image/webp"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- The interface is React-rendered, so without JavaScript the page is
         otherwise one <div>. Googlebot renders JavaScript and sees the full
         site; this is for the crawlers and readers that do not.

         It is a genuine, accurate summary of what the rendered page says —
         same name, same roles, same links. It is NOT a keyword block and must
         never become one: anything here that is not also true on the rendered
         page would be cloaking. Keep it to facts that do not change, so it
         cannot drift away from the CMS content. -->
    <noscript>
      <div style="max-width: 46rem; margin: 0 auto; padding: 2rem; color: #f4f0e8; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="font-size: 1.9rem; margin-bottom: 0.25rem">Mohammed Majeed J</h1>
        <p style="color: #d9a855; margin-bottom: 1.25rem">Full Stack Developer &middot; Python Backend Developer</p>
        <p style="color: #c6c0b2">
          MCA student at Periyar University, Salem, and a full stack developer
          working across Python and FastAPI backends, React and TypeScript
          interfaces, and applied AI. Previously BCA at Islamiah College
          (Autonomous), Vaniyambadi.
        </p>
        <p style="color: #c6c0b2">
          The full portfolio — projects, skills, career, certificates and
          contact form — needs JavaScript. These links do not:
        </p>
        <ul style="color: #c6c0b2">
          <li><a style="color: #d9a855" href="https://github.com/majeed74905">GitHub</a></li>
          <li><a style="color: #d9a855" href="https://www.linkedin.com/in/majeed74905/">LinkedIn</a></li>
          <li><a style="color: #d9a855" href="mailto:majeed74905@gmail.com">majeed74905@gmail.com</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
