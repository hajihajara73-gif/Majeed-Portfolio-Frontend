name: Deploy frontend to EC2

# Two jobs on purpose.
#
# The build runs on a GitHub-hosted runner: the t3.micro has 913 MB of RAM and
# a Vite + three.js build is the step most likely to exhaust it.
#
# The deploy runs on a self-hosted runner ON the instance. GitHub's hosted
# runners have thousands of rotating egress IPs, so reaching this box over SSH
# would mean opening port 22 to the whole internet. The runner dials out
# instead, so nothing inbound is required and no SSH key leaves the server.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix admin
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        # Same-origin API: nginx proxies /api to uvicorn on this host, so the
        # bundle needs no absolute backend URL and the admin session cookie
        # stays first-party.
        env:
          VITE_API_BASE_URL: ''
          VITE_CONTACT_ENDPOINT: '/api/public/contact'
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build:all
      - name: Validate the build before it can be shipped
        run: |
          test -f dist/index.html       || { echo "no dist/index.html"; exit 1; }
          test -f dist/admin/index.html || { echo "no dist/admin/index.html"; exit 1; }
          echo "files: $(find dist -type f | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    runs-on: [self-hosted, ec2, deploy]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: incoming

      - name: Stage, validate, keep the old release, then swap
        run: |
          set -euo pipefail
          TARGET=/var/www/portfolio/frontend
          test -f incoming/index.html       || { echo "artifact invalid"; exit 1; }
          test -f incoming/admin/index.html || { echo "artifact invalid"; exit 1; }

          sudo rm -rf "${TARGET}.prev"
          sudo cp -a "$TARGET" "${TARGET}.prev"

          sudo rsync -a --delete incoming/ "$TARGET"/
          sudo chown -R ec2-user:nginx "$TARGET"
          sudo find "$TARGET" -type d -exec chmod 755 {} \;
          sudo find "$TARGET" -type f -exec chmod 644 {} \;
          echo "deployed $(find "$TARGET" -type f | wc -l) files"

      - name: Verify, roll back if the site is broken
        run: |
          set -uo pipefail
          TARGET=/var/www/portfolio/frontend
          home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1/)
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1/api/health)
          echo "homepage=$home api/health=$api"
          if [ "$home" != "200" ]; then
            echo "homepage is $home — rolling back"
            sudo rsync -a --delete "${TARGET}.prev"/ "$TARGET"/
            exit 1
          fi

      - name: Clean the workspace
        if: always()
        run: rm -rf incoming
